<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- HTML をキャッシュさせない（LINE アプリ内ブラウザが古い画面を出し続けるのを防ぐ） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>KURUMI Shift</title>
  <link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>
  <!-- グローバルローディング -->
  <div id="loading" class="overlay" aria-live="polite">
    <div class="spinner" role="status" aria-label="読み込み中"></div>
    <p id="loading-text">読み込み中...</p>
  </div>

  <!-- トースト -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- アプリ本体 -->
  <header class="app-header">
    <span class="app-title">KURUMI Shift</span>
  </header>
  <main id="app" class="app-main"></main>

  <!-- モーダルコンテナ -->
  <div id="modal-root"></div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!--
    アプリ用スクリプトは「固定バージョン(?v=)」で読み込む。
    index.html は no-cache なので常に最新の ?v を参照でき、
    JS はブラウザにキャッシュされるため2回目以降の起動が速い。
    フロント更新時は下の v= の数字を上げること（キャッシュ更新）。
  -->
  <script src="js/config.js?v=18"></script>
  <script src="js/state.js?v=18"></script>
  <script src="js/api.js?v=18"></script>
  <script src="js/liff-client.js?v=18"></script>
  <script src="js/ui.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
</body>
</html>
