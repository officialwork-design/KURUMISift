<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- HTML をキャッシュさせない（LINE アプリ内ブラウザが古い画面を出し続けるのを防ぐ） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>KURUMI Shift</title>
  <link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>
  <!-- グローバルローディング -->
  <div id="loading" class="overlay" aria-live="polite">
    <div class="spinner" role="status" aria-label="読み込み中"></div>
    <p id="loading-text">読み込み中...</p>
  </div>

  <!-- トースト -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- アプリ本体 -->
  <header class="app-header">
    <span class="app-title">KURUMI Shift</span>
  </header>
  <main id="app" class="app-main"></main>

  <!-- モーダルコンテナ -->
  <div id="modal-root"></div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!--
    アプリ用スクリプトはキャッシュバスティング付きで読み込む。
    GitHub Pages / LINE アプリ内ブラウザが古い config.js をキャッシュして
    「API_URL が未設定です」と誤表示するのを防ぐ。
    document.write により、非同期化せず記述順どおりに実行される。
  -->
  <script>
    (function () {
      var v = Date.now();
      var files = ['config', 'state', 'api', 'liff-client', 'ui', 'app'];
      for (var i = 0; i < files.length; i++) {
        document.write('<script src="js/' + files[i] + '.js?v=' + v + '"><\/script>');
      }
    })();
  </script>
</body>
</html>
