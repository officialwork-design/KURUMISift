name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          cp -r liff site/liff
          cp -r admin site/admin
          # ルートURL(404回避)用のリダイレクトページを生成し liff/ へ誘導
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="utf-8" />
            <title>KURUMI Shift</title>
            <meta http-equiv="refresh" content="0; url=./liff/" />
            <link rel="canonical" href="./liff/" />
          </head>
          <body>
            <p>KURUMI Shift へ移動します… 自動で移動しない場合は <a href="./liff/">こちら</a>。</p>
          </body>
          </html>
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
